name: Docker Build & Scan

on:
  push:
    branches: [main]
    paths:
      - "app/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
  workflow_dispatch: {}

defaults:
  run:
    working-directory: app

jobs:
  build-scan:
    name: Build + Trivy scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --platform linux/amd64 -t threat-composer:${{ github.sha }} .

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        working-directory: app
        with:
          image-ref: "threat-composer:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # docker-push.yml (triggered by workflow_run, push events only)
      # downloads this exact image and pushes it — never rebuilding under
      # a different set of credentials.
      - name: Save image
        if: github.event_name != 'pull_request'
        run: docker save threat-composer:${{ github.sha }} -o /tmp/threat-composer.tar

      - name: Upload image artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: threat-composer-image
          path: /tmp/threat-composer.tar
          retention-days: 1
