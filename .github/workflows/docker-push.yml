name: Docker Push

on:
  workflow_run:
    workflows: ["Docker Build & Scan"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  actions: read

defaults:
  run:
    working-directory: app

jobs:
  push:
    name: Push to ECR
    # Auto path: only follow a build+scan that (a) actually succeeded and
    # (b) came from a real push to main — never a PR preview or a test
    # dispatch of docker-build-scan.yml. Manual path (workflow_dispatch on
    # *this* workflow) always runs — it's a deliberate, explicit request.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      # docker-push.yml's own github.sha (workflow_run path) reflects this
      # repo's default branch at run time, not necessarily the exact commit
      # docker-build-scan.yml built — always resolve from the triggering
      # run's head_sha instead.
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SHA }}

      # Auto path: reuse the exact image docker-build-scan.yml already
      # built and scanned.
      - name: Download image artifact from the triggering run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: threat-composer-image
          path: app
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load image
        if: github.event_name == 'workflow_run'
        run: docker load -i threat-composer.tar

      # Manual path: no prior build to reuse — build it fresh here.
      - name: Build image
        if: github.event_name == 'workflow_dispatch'
        run: docker build --platform linux/amd64 -t threat-composer:${{ env.SHA }} .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
          aws-region: eu-west-2

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: threat-composer
        run: |
          docker tag threat-composer:$SHA $ECR_REGISTRY/$ECR_REPOSITORY:$SHA
          docker tag threat-composer:$SHA $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$SHA
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
