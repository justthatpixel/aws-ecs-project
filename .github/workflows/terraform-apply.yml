name: Terraform Apply

on:
  workflow_run:
    workflows: ["Terraform Plan"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.15.8"

concurrency:
  group: terraform-state
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform

jobs:
  apply:
    name: Terraform Apply
    # Auto path: only follow a plan that (a) actually succeeded and (b) came
    # from a real push to main — never a PR preview or a test dispatch of
    # terraform-plan.yml. Manual path (workflow_dispatch on *this* workflow)
    # always runs — it's a deliberate, explicit request to apply.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::720644165598:role/github-actions-terraform-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init

      # Auto path: download the exact plan terraform-plan.yml already
      # generated (under the read-only plan role) and apply that directly —
      # no re-planning under the more privileged apply role. Terraform
      # refuses to apply if state has moved on since (a stale-plan error),
      # which is the correct, safe failure mode.
      - name: Download plan artifact from the triggering run
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Manual path: no prior plan to consume — generate and apply one in
      # this same run, self-contained.
      - name: Terraform plan
        if: github.event_name == 'workflow_dispatch'
        run: terraform plan -no-color -out=tfplan

      - name: Terraform apply
        run: terraform apply -no-color -auto-approve tfplan
