name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm you want to tear down all infra managed by this stack'
        required: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.15.8"

concurrency:
  group: terraform-state
  cancel-in-progress: false

defaults:
  run:
    working-directory: terraform

jobs:
  destroy:
    name: Terraform Destroy
    if: github.event.inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::720644165598:role/github-actions-terraform-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan (destroy)
        run: terraform plan -destroy -no-color -out=tfplan

      - name: Destroy plan summary
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform destroy
        run: terraform apply -no-color -auto-approve tfplan
