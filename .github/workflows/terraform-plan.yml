name: Terraform Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "**.tf"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform-plan.yml"
  push:
    branches: [main]
    paths:
      - "**.tf"
      - ".tflint.hcl"
      - ".checkov.yaml"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  TF_VERSION: "1.15.8"

# Shared with terraform-apply.yml on purpose — a plan and an apply must
# never run concurrently against the same state, or they race for the S3
# lock (one wins, the other leaves an orphaned .tflock behind).
concurrency:
  group: terraform-state
  cancel-in-progress: false

jobs:
  validate:
    name: Format, Lint, Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt (check only)
        run: terraform fmt -recursive -check -diff

      - name: Terraform init (no backend, syntax/module checks only)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.64.0

      - name: TFLint init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TFLint
        run: tflint --config="${GITHUB_WORKSPACE}/.tflint.hcl" --call-module-type=all

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml
          quiet: true

      - name: Trivy IaC config scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  plan:
    name: Terraform Plan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::720644165598:role/github-actions-terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: Plan summary
        run: terraform show -no-color tfplan >> "$GITHUB_STEP_SUMMARY"

      # terraform-apply.yml (triggered by workflow_run, push events only)
      # downloads this exact plan and applies it directly — never
      # re-planning under the more privileged apply role.
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 1
