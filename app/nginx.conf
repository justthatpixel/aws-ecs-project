worker_processes auto;

# nginx-unprivileged runs as a non-root user, which can't write to the
# default /run and /var/cache/nginx locations — redirect them to /tmp.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # nginx-unprivileged already redirects logs to stdout/stderr by default,
    # but being explicit here doesn't hurt
    access_log /dev/stdout;
    error_log  /dev/stderr;

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # SPA fallback — critical for React Router / client-side routing.
        # Without this, refreshing on a non-root route (e.g. /dashboard) 404s.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Optional: cache static assets aggressively since CRA/Vite
        # fingerprints filenames on build
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
