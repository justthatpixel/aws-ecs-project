framework:
  - terraform

skip-check:
  # ALB deletion protection intentionally off — this stack has a Terraform
  # destroy pipeline that needs to be able to tear the ALB down cleanly.
  - CKV_AWS_150

  # ALB access logging needs a dedicated S3 bucket + ELB service account
  # bucket policy. Deliberately out of scope for now — revisit later.
  - CKV_AWS_91

  # Default CloudWatch Logs / ECR encryption-at-rest already applies; a
  # customer-managed KMS key is extra hardening, not required here.
  - CKV_AWS_158
  - CKV_AWS_136

  # ECR repo currently uses a moving `:latest` tag, which the deploy
  # pipeline force-redeploys against. Revisit alongside switching CI to
  # immutable per-commit-SHA tags.
  - CKV_AWS_51

  # SG rule allowing 0.0.0.0/0 on port 80: the ALB's HTTP listener only
  # exists to 301-redirect to HTTPS (intentional public entrypoint, not a
  # data path). Also flags the ECS ingress rule as a false positive — that
  # rule is scoped via referenced_security_group_id (the ALB SG), never a
  # public cidr.
  - CKV_AWS_260

  # GitHub Actions IAM roles (bootstrap/github-oidc): the IAM-specific
  # statements are already scoped to role/threat-composer-* and the state
  # bucket ARN — these checks flag the separate ec2/ecs/elbv2/logs
  # statement's Resource "*", which is unavoidable here since this CI role
  # has to provision an entire stack across services where most
  # actions (e.g. ec2:CreateVpc) don't support resource-level ARN
  # restriction at all. Standard tradeoff for an infra-provisioning role.
  - CKV_AWS_356
  - CKV_AWS_111
  - CKV_AWS_107
  - CKV_AWS_109

  # Checkov's graph checker doesn't trace SG attachment across module
  # boundaries — both flagged SGs are genuinely attached (alb SG on the
  # ALB in modules/alb, ecs-service SG on the ECS service's network
  # config in modules/ecs), just in a different module than the one
  # that creates them.
  - CKV2_AWS_5

  # VPC flow logs / DNSSEC signing / Route53 query logging / S3 event
  # notifications, cross-region replication, and access logging: all
  # real observability/DR hardening, but each needs its own new
  # infra (log groups, IAM roles, a second bucket/region, or — for
  # DNSSEC — registrar-side DS record support that isn't guaranteed).
  # Deliberately out of scope for this project's current stage.
  - CKV2_AWS_11
  - CKV2_AWS_28
  - CKV2_AWS_38
  - CKV2_AWS_39
  - CKV2_AWS_62
  - CKV_AWS_144
  - CKV_AWS_18

  # Default AES256 (SSE-S3) encryption already applies to the state
  # bucket; a customer-managed KMS key is extra hardening, same
  # tradeoff as the ECR/CloudWatch skips above.
  - CKV_AWS_145

compact: true
quiet: true
